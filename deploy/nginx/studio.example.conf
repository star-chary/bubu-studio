# 示例配置：部署前替换域名、证书位置，并安装同目录中的代理片段。
server {
    listen 80;
    listen [::]:80;
    server_name studio.example.com;
    server_tokens off;
    return 301 https://studio.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studio.example.com;
    server_tokens off;

    ssl_certificate /etc/nginx/ssl/studio.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/studio.example.com/privkey.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:StudioSSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/frame-space/current/frontend;
    index index.html;
    # Canvas JSON saves are limited to 2 MiB by the Go handler.
    client_max_body_size 2m;
    client_body_timeout 150s;

    access_log /var/log/nginx/studio.example.com.access.log;
    error_log /var/log/nginx/studio.example.com.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/assets {
        include /etc/nginx/snippets/frame-space-upload-size.conf;
        include /etc/nginx/snippets/frame-space-proxy.conf;
        # Stream binary uploads to Go's bounded temporary-file pipeline.
        proxy_request_buffering off;
    }

    location /api/ {
        include /etc/nginx/snippets/frame-space-proxy.conf;
    }

    location = /health {
        include /etc/nginx/snippets/frame-space-proxy.conf;
        access_log off;
    }

    # Copy admin/dist contents to the release's admin/ directory before enabling.
    location = /admin { return 301 /admin/; }
    location = /admin/index.html {
        root /opt/frame-space/current;
        expires -1;
    }
    location /admin/assets/ {
        root /opt/frame-space/current;
        try_files $uri =404;
        expires 1y;
    }
    location /admin/ {
        root /opt/frame-space/current;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /index.html { expires -1; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
