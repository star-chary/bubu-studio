services:
  postgres:
    image: postgres:16
    container_name: frame-space-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: frame_space
      POSTGRES_DB: frame_space
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frame_space -d frame_space"]
      interval: 5s
      timeout: 3s
      retries: 12
